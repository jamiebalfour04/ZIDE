name: Build ZIDE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-zide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    name: macOS ARM64 native image
    runs-on: macos-15

    steps:
      - name: Check out ZIDE
        uses: actions/checkout@v6

      - name: Install Liberica Native Image Kit 25 with JavaFX
        uses: actions/setup-java@v6
        with:
          distribution: liberica-nik
          java-version: "25"
          java-package: jdk+fx
          architecture: aarch64

      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Show native-image version
        run: native-image --version

      - name: Build ZIDE
        run: |
          mkdir -p build/native
          native-image \
            -O3 \
            -march=compatibility \
            -H:+UnlockExperimentalVMOptions \
            -H:ReflectionConfigurationFiles=build/reflect-config.json \
            -H:JNIConfigurationFiles=build/jni-config-macos.json \
            -H:ResourceConfigurationFiles=build/resource-config.json \
            --enable-native-access=javafx.graphics \
            '--initialize-at-run-time=com.sun.jna,com.sun.jna.NativeLibrary,com.sun.jna.CallbackReference,jamiebalfour.helpers.MacApplicationMenuJNA' \
            '--initialize-at-run-time=com.sun.glass.ui.mac.MacAccessible,com.sun.glass.ui.mac.MacAccessible$MacAttribute,com.sun.glass.ui.mac.MacAccessible$MacAction,com.sun.glass.ui.mac.MacAccessible$MacRole,com.sun.glass.ui.mac.MacAccessible$MacSubrole,com.sun.glass.ui.mac.MacAccessible$MacNotification,com.sun.glass.ui.mac.MacAccessible$MacOrientation,com.sun.glass.ui.mac.MacAccessible$MacText,com.sun.glass.ui.mac.MacGestureSupport' \
            -H:Name=build/native/zide-aarch64 \
            -jar build/zide.jar \
            --no-fallback

      - name: Verify native image
        run: |
          test -x build/native/zide-aarch64
          file build/native/zide-aarch64
          file build/native/zide-aarch64 | grep -q arm64

      - name: Package macOS app bundle
        run: |
          app="build/native/ZIDE.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp build/native/zide-aarch64 "$app/Contents/MacOS/ZIDE"
          cp ZIDE.icns "$app/Contents/Resources/ZIDE.icns"
          major="$(sed -n 's/.*MAJOR_VERSION = "\([^"]*\)".*/\1/p' src/jamiebalfour/zide/core/ZIDE.java)"
          minor="$(sed -n 's/.*MINOR_VERSION = "\([^"]*\)".*/\1/p' src/jamiebalfour/zide/core/ZIDE.java)"
          version="$major.$minor.${GITHUB_RUN_NUMBER}"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>ZIDE</string>
            <key>CFBundleIconFile</key><string>ZIDE</string>
            <key>CFBundleIdentifier</key><string>scot.jamiebalfour.zide</string>
            <key>CFBundleName</key><string>ZIDE</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/ZIDE"
          ditto -c -k --sequesterRsrc --keepParent "$app" build/native/ZIDE-macos-arm64.zip

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v6
        with:
          name: zide-macos-aarch64-app
          path: build/native/ZIDE.app
          retention-days: 3
          if-no-files-found: error

      - name: Upload macOS app archive
        uses: actions/upload-artifact@v6
        with:
          name: zide-macos-aarch64-app-zip
          path: build/native/ZIDE-macos-arm64.zip
          retention-days: 3
          if-no-files-found: error

      - name: Upload ZIDE
        uses: actions/upload-artifact@v6
        with:
          name: zide-macos-aarch64
          path: build/native/zide-aarch64
          retention-days: 3
          if-no-files-found: error

      - name: Deploy macOS ZIDE with rsync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_HOST_KEY: ${{ secrets.SFTP_HOST_KEY }}
          SFTP_DESTINATION: ${{ secrets.SFTP_DESTINATION_MACOS }}
          SFTP_PACKAGE_DESTINATION: ${{ secrets.SFTP_PACKAGE_DESTINATION_MACOS }}
        run: |
          test -n "$SFTP_HOST"
          test -n "$SFTP_USERNAME"
          test -n "$SFTP_PRIVATE_KEY"
          test -n "$SFTP_HOST_KEY"
          test -n "$SFTP_DESTINATION"
          test -n "$SFTP_PACKAGE_DESTINATION"
          port="${SFTP_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%b\n' "$SFTP_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/zide_deploy"
          printf '%b\n' "$SFTP_HOST_KEY" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/zide_deploy" "$HOME/.ssh/known_hosts"
          if ! grep -Eq '^-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----$' "$HOME/.ssh/zide_deploy"; then
            echo "::error::SFTP_PRIVATE_KEY must contain the complete private key, including its BEGIN and END lines."
            exit 1
          fi
          if ! ssh-keygen -y -P "" -f "$HOME/.ssh/zide_deploy" > /dev/null; then
            echo "::error::SFTP_PRIVATE_KEY is invalid or passphrase-protected."
            exit 1
          fi
          rsync -az --progress \
            -e "ssh -p $port -i $HOME/.ssh/zide_deploy -o IdentitiesOnly=yes" \
            build/native/zide-aarch64 \
            "$SFTP_USERNAME@$SFTP_HOST:$SFTP_DESTINATION/ZIDE"
          rsync -az --progress \
            -e "ssh -p $port -i $HOME/.ssh/zide_deploy -o IdentitiesOnly=yes" \
            build/native/ZIDE.app \
            "$SFTP_USERNAME@$SFTP_HOST:$SFTP_DESTINATION/"
          rsync -az --progress \
            -e "ssh -p $port -i $HOME/.ssh/zide_deploy -o IdentitiesOnly=yes" \
            build/native/ZIDE-macos-arm64.zip \
            "$SFTP_USERNAME@$SFTP_HOST:$SFTP_DESTINATION/"
          rsync -az --progress \
            -e "ssh -p $port -i $HOME/.ssh/zide_deploy -o IdentitiesOnly=yes" \
            build/native/ZIDE-macos-arm64.zip \
            "$SFTP_USERNAME@$SFTP_HOST:$SFTP_PACKAGE_DESTINATION/"

  build-windows-x64:
    name: Windows x64 native image
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Install Liberica Native Image Kit 25 with JavaFX
        uses: actions/setup-java@v6
        with:
          distribution: liberica-nik
          java-version: "25"
          java-package: jdk+fx
          architecture: x64
      - name: Enable the MSVC x64 toolchain
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64
          "PATH=$env:PATH" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=$env:INCLUDE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$env:LIB" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBPATH=$env:LIBPATH" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare Windows reflection configuration
        shell: pwsh
        run: |
          $config = Get-Content build/reflect-config.json -Raw | ConvertFrom-Json
          @($config | Where-Object { -not $_.name.StartsWith("com.sun.glass.ui.mac.") }) |
            ConvertTo-Json -Depth 20 | Set-Content build/reflect-config-windows.json -Encoding utf8
      - name: Build ZIDE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/native | Out-Null
          native-image `
            -O3 `
            -march=compatibility `
            -H:+UnlockExperimentalVMOptions `
            -H:ReflectionConfigurationFiles=build/reflect-config-windows.json `
            -H:ResourceConfigurationFiles=build/resource-config.json `
            --enable-native-access=javafx.graphics `
            -H:Name=build/native/zide-win-x64 `
            -jar build/zide.jar `
            --no-fallback
      - name: Verify native image
        shell: pwsh
        run: |
          if (-not (Test-Path build/native/zide-win-x64.exe)) { throw "Windows ZIDE was not produced." }
          Copy-Item src/files/zide.png build/native/zide.png -Force
          Compress-Archive -Path build/native/zide-win-x64.exe,build/native/zide.png -DestinationPath build/native/ZIDE-windows-x64.zip -Force
      - name: Upload ZIDE
        uses: actions/upload-artifact@v6
        with:
          name: zide-windows-x64
          path: |
            build/native/zide-win-x64.exe
            build/native/zide.png
            build/native/ZIDE-windows-x64.zip
          retention-days: 3
          if-no-files-found: error
      - name: Install rsync
        uses: msys2/setup-msys2@v2
        with:
          install: openssh rsync
      - name: Deploy Windows ZIDE with rsync
        shell: msys2 {0}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_HOST_KEY: ${{ secrets.SFTP_HOST_KEY }}
          SFTP_DESTINATION: ${{ secrets.SFTP_DESTINATION_WINDOWS }}
          SFTP_PACKAGE_DESTINATION: ${{ secrets.SFTP_PACKAGE_DESTINATION_WINDOWS }}
        run: |
          test -n "$SFTP_HOST" && test -n "$SFTP_USERNAME" && test -n "$SFTP_PRIVATE_KEY"
          test -n "$SFTP_HOST_KEY" && test -n "$SFTP_DESTINATION"
          test -n "$SFTP_PACKAGE_DESTINATION"
          port="${SFTP_PORT:-22}"
          ssh_dir="$(cygpath -u "$RUNNER_TEMP")/zide-ssh"
          mkdir -p "$ssh_dir"
          printf '%b\n' "$SFTP_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/deploy_key"
          printf '%b\n' "$SFTP_HOST_KEY" | tr -d '\r' > "$ssh_dir/known_hosts"
          ssh-keygen -y -P "" -f "$ssh_dir/deploy_key" > /dev/null
          rsync -az --progress \
            -e "ssh -p $port -i $ssh_dir/deploy_key -o UserKnownHostsFile=$ssh_dir/known_hosts -o IdentitiesOnly=yes" \
            build/native/zide-win-x64.exe "$SFTP_USERNAME@$SFTP_HOST:$SFTP_DESTINATION/ZIDE.exe"
          rsync -az --progress \
            -e "ssh -p $port -i $ssh_dir/deploy_key -o UserKnownHostsFile=$ssh_dir/known_hosts -o IdentitiesOnly=yes" \
            build/native/zide.png "$SFTP_USERNAME@$SFTP_HOST:$SFTP_DESTINATION/zide.png"
          rsync -az --progress \
            -e "ssh -p $port -i $ssh_dir/deploy_key -o UserKnownHostsFile=$ssh_dir/known_hosts -o IdentitiesOnly=yes" \
            build/native/ZIDE-windows-x64.zip "$SFTP_USERNAME@$SFTP_HOST:$SFTP_PACKAGE_DESTINATION/"
          rsync -az --progress \
            -e "ssh -p $port -i $ssh_dir/deploy_key -o UserKnownHostsFile=$ssh_dir/known_hosts -o IdentitiesOnly=yes" \
            build/native/ZIDE-windows-x64.zip "$SFTP_USERNAME@$SFTP_HOST:$SFTP_DESTINATION/"

  build-linux-x64:
    name: Linux x64 native image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Liberica Native Image Kit 25 with JavaFX
        uses: actions/setup-java@v6
        with:
          distribution: liberica-nik
          java-version: "25"
          java-package: jdk+fx
          architecture: x64
      - name: Install JavaFX build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libasound2-dev
      - name: Prepare Linux reflection configuration
        run: |
          jq '[.[] | select(.name | startswith("com.sun.glass.ui.mac.") | not)]' \
            build/reflect-config.json > build/reflect-config-linux.json
      - name: Build ZIDE
        run: |
          mkdir -p build/native
          native-image \
            -O3 \
            -march=compatibility \
            -H:+UnlockExperimentalVMOptions \
            -H:ReflectionConfigurationFiles=build/reflect-config-linux.json \
            -H:ResourceConfigurationFiles=build/resource-config.json \
            --enable-native-access=javafx.graphics \
            -H:Name=build/native/zide-linux-x64 \
            -jar build/zide.jar \
            --no-fallback
      - name: Verify native image
        run: |
          test -x build/native/zide-linux-x64
          file build/native/zide-linux-x64 | grep -q x86-64
          cp src/files/zide.png build/native/zide.png
          tar -czf build/native/ZIDE-linux-x64.tar.gz -C build/native zide-linux-x64 zide.png
      - name: Upload ZIDE
        uses: actions/upload-artifact@v6
        with:
          name: zide-linux-x64
          path: |
            build/native/zide-linux-x64
            build/native/zide.png
            build/native/ZIDE-linux-x64.tar.gz
          retention-days: 3
          if-no-files-found: error
      - name: Deploy Linux ZIDE with rsync
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_HOST_KEY: ${{ secrets.SFTP_HOST_KEY }}
          SFTP_DESTINATION: ${{ secrets.SFTP_DESTINATION_LINUX }}
          SFTP_PACKAGE_DESTINATION: ${{ secrets.SFTP_PACKAGE_DESTINATION_LINUX }}
        run: |
          test -n "$SFTP_HOST" && test -n "$SFTP_USERNAME" && test -n "$SFTP_PRIVATE_KEY"
          test -n "$SFTP_HOST_KEY" && test -n "$SFTP_DESTINATION"
          test -n "$SFTP_PACKAGE_DESTINATION"
          port="${SFTP_PORT:-22}"
          install -d -m 700 "$HOME/.ssh"
          printf '%b\n' "$SFTP_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/zide_deploy"
          printf '%b\n' "$SFTP_HOST_KEY" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/zide_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P "" -f "$HOME/.ssh/zide_deploy" > /dev/null
          rsync -az --progress \
            -e "ssh -p $port -i $HOME/.ssh/zide_deploy -o IdentitiesOnly=yes" \
            build/native/zide-linux-x64 "$SFTP_USERNAME@$SFTP_HOST:$SFTP_DESTINATION/ZIDE"
          rsync -az --progress \
            -e "ssh -p $port -i $HOME/.ssh/zide_deploy -o IdentitiesOnly=yes" \
            build/native/zide.png "$SFTP_USERNAME@$SFTP_HOST:$SFTP_DESTINATION/zide.png"
          rsync -az --progress \
            -e "ssh -p $port -i $HOME/.ssh/zide_deploy -o IdentitiesOnly=yes" \
            build/native/ZIDE-linux-x64.tar.gz "$SFTP_USERNAME@$SFTP_HOST:$SFTP_PACKAGE_DESTINATION/"
          rsync -az --progress \
            -e "ssh -p $port -i $HOME/.ssh/zide_deploy -o IdentitiesOnly=yes" \
            build/native/ZIDE-linux-x64.tar.gz "$SFTP_USERNAME@$SFTP_HOST:$SFTP_DESTINATION/"
